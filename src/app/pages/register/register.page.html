<ion-header>
  <ion-toolbar><ion-title>Crear cuenta</ion-title></ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-item><ion-input label="Nombre" labelPlacement="floating" [(ngModel)]="form.name"></ion-input></ion-item>
  <ion-item><ion-input label="Email" labelPlacement="floating" type="email" [(ngModel)]="form.email"></ion-input></ion-item>
  <ion-item><ion-input label="Teléfono" labelPlacement="floating" [(ngModel)]="form.phone"></ion-input></ion-item>
  <ion-item><ion-input label="Contraseña" labelPlacement="floating" type="password" [(ngModel)]="form.password"></ion-input></ion-item>
  <ion-item>
    <ion-select label="Rol" [(ngModel)]="form.role">
      <ion-select-option value="client">Cliente</ion-select-option>
      <ion-select-option value="driver">Conductor</ion-select-option>
    </ion-select>
  </ion-item>
  @if (form.role === 'driver') {
    <ion-item><ion-input label="Licencia" labelPlacement="floating" [(ngModel)]="form.license_number"></ion-input></ion-item>
    <ion-item><ion-input label="Placa" labelPlacement="floating" [(ngModel)]="form.plate"></ion-input></ion-item>
    <ion-item><ion-input label="Marca" labelPlacement="floating" [(ngModel)]="form.brand"></ion-input></ion-item>
    <ion-item><ion-input label="Modelo" labelPlacement="floating" [(ngModel)]="form.model"></ion-input></ion-item>
    <ion-item><ion-input label="Año" labelPlacement="floating" type="number" [(ngModel)]="form.year"></ion-input></ion-item>
    <ion-item><ion-input label="Capacidad" labelPlacement="floating" type="number" [(ngModel)]="form.capacity"></ion-input></ion-item>
    <ion-item><ion-input label="Color" labelPlacement="floating" [(ngModel)]="form.color"></ion-input></ion-item>
  }
  @if (error) {
    <ion-text color="danger"><p>{{ error }}</p></ion-text>
  }
  <ion-button expand="block" (click)="submit()">Registrarme</ion-button>
  <ion-button expand="block" fill="clear" routerLink="/login">Ya tengo cuenta</ion-button>
</ion-content>
