<ion-header>
  <ion-toolbar><ion-title>Recuperar contraseña</ion-title></ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-item><ion-input label="Email" labelPlacement="floating" type="email" [(ngModel)]="email"></ion-input></ion-item>
  <ion-item><ion-input label="Nueva contraseña" labelPlacement="floating" type="password" [(ngModel)]="password"></ion-input></ion-item>
  @if (msg) {
    <ion-text color="success"><p>{{ msg }}</p></ion-text>
  }
  @if (error) {
    <ion-text color="danger"><p>{{ error }}</p></ion-text>
  }
  <ion-button expand="block" (click)="submit()">Restablecer</ion-button>
  <ion-button expand="block" fill="clear" routerLink="/login">Volver al login</ion-button>
</ion-content>
